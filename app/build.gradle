plugins {
    id 'com.android.application'
    id 'com.github.triplet.play'
}

// Identifiants de signature release + compte de service Play, lus depuis keystore.properties (gitignore).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.leekwars.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.leekwars.app"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "1.1.0"

        // Injecte dans le AndroidManifest les parametres de la TWA.
        manifestPlaceholders = [
            hostName       : "leekwars.com",
            defaultUrl     : "https://leekwars.com/",
            launcherName   : "Leek Wars",
            // Lien de confiance app <-> site (Digital Asset Links) ; doit matcher /.well-known/assetlinks.json.
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], ' +
                    '"target": {"namespace": "web", "site": "https://leekwars.com"}}]'
        ]
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signe seulement si keystore.properties est present (build release local possible sans la cle).
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Selectionne un JDK 17 pour la compilation quel que soit le JDK par defaut de la machine (25 ici).
// Portable (CI, autres postes) : pas de chemin en dur ; foojay (settings.gradle) le provisionne si absent.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Support officiel des Trusted Web Activities (remplace l'ancien custom-tabs-client abandonne).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}

play {
    if (keystoreProps['serviceAccountFile'] != null) {
        serviceAccountCredentials.set(file(keystoreProps['serviceAccountFile']))
    }
    track.set("internal")
    defaultToAppBundles.set(true)
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.DRAFT)
}
